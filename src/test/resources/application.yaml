spring:
  application:
    name: gateway

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

server:
  port: 0

scouter:
  environment: test
  session:
    ttl-hours: 168

logging:
  level:
    org.springframework.security: WARN